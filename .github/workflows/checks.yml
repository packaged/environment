name: Core Checks
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  code-checks:
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: DependencyVulnerabilityScan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: Go Mod Vendor
        run: go mod vendor
      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        if: always()
        run: go vet ./...

      - name: Install golint
        if: always()
        run: go install golang.org/x/lint/golint@latest

      - name: Run golint
        if: always()
        run: golint ./...

      - name: Run Revive Action by pulling pre-built image
        if: always()
        uses: docker://morphy/revive-action@sha256:1ec5904abc4d8b2cd5fbb2987fc79a227f21a4231d757cc9a09a9ee3ab3c328b # v2
        with:
          path: "./..."

      - name: Run Gosec Security Scanner
        uses: securego/gosec@5eb1d104ef85ff2c905c877eb600e8c1dee33a22 # v2.30.0
        with:
          args: ./...
        env:
          GOROOT: ""

      - name: Unit Tests
        run: go test -v -coverprofile coverage.out ./...

      - name: Check Test coverage
        env:
          TESTCOVERAGE_THRESHOLD: 100
        run: |
          echo "Quality Gate: checking test coverage is above threshold ..."
          echo "Threshold             : $TESTCOVERAGE_THRESHOLD %"
          totalCoverage=`go tool cover -func=coverage.out | grep total | grep -Eo '[0-9]+\.[0-9]+'`
          echo "Current test coverage : $totalCoverage %"
          if (( $(echo "$totalCoverage $TESTCOVERAGE_THRESHOLD" | awk '{print ($1 >= $2)}') )); then
             echo "OK"
          else
             echo "Current test coverage is below threshold. Please add more unit tests or adjust threshold to a lower value."
             go tool cover -func=coverage.out
             exit 1
          fi